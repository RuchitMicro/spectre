[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Spectre"
version = "0.1.0"
description = "Opinionated Django project"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "requests>=2.31",
  "inquirer>=3.3"
]

[project.scripts]
spectre = "spectre.cli:app"
