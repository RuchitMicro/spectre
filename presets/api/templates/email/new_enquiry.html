<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>New enquiry</title>
</head>
<body style="margin:0; padding:24px; background:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1a1a1a;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:8px; border:1px solid #e4e6eb;">
        <tr>
            <td style="padding:24px 28px; border-bottom:1px solid #e4e6eb;">
                <h1 style="margin:0; font-size:18px; font-weight:600;">New enquiry received</h1>
            </td>
        </tr>
        <tr>
            <td style="padding:24px 28px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="font-size:14px; line-height:1.6;">
                    <tr>
                        <td style="padding:6px 0; color:#6b7280; width:140px;">Name</td>
                        <td style="padding:6px 0;">{{ contact.full_name }}</td>
                    </tr>
                    <tr>
                        <td style="padding:6px 0; color:#6b7280;">Email</td>
                        <td style="padding:6px 0;"><a href="mailto:{{ contact.email }}" style="color:#2563eb;">{{ contact.email }}</a></td>
                    </tr>
                    <tr>
                        <td style="padding:6px 0; color:#6b7280;">Phone</td>
                        <td style="padding:6px 0;">{{ contact.phone_number }}</td>
                    </tr>
                    <tr>
                        <td style="padding:6px 0; color:#6b7280; vertical-align:top;">Requirement</td>
                        <td style="padding:6px 0; white-space:pre-wrap;">{{ contact.requirement }}</td>
                    </tr>
                    {% if contact.journey_path %}
                    <tr>
                        <td style="padding:6px 0; color:#6b7280; vertical-align:top;">Journey</td>
                        <td style="padding:6px 0; word-break:break-all; color:#6b7280; font-size:12px;">{{ contact.journey_path }}</td>
                    </tr>
                    {% endif %}
                    <tr>
                        <td style="padding:6px 0; color:#6b7280;">Received</td>
                        <td style="padding:6px 0;">{{ contact.created_at }}</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
